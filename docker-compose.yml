services:
  postgres:
    image: postgres:16
    container_name: ops311_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ops311}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ops} -d ${POSTGRES_DB:-ops311}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
