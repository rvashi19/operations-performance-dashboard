name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops_local_dev
          POSTGRES_DB: ops311
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ops" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops_local_dev
      POSTGRES_DB: ops311
      REQUIRE_DB: "1"   # integration tests fail instead of skipping if Postgres is missing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests (integration tests fail, not skip, without Postgres)
        run: python -m pytest -v -rs
